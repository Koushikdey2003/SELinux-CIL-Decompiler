name: DumprX SEPolicy

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL репозитория с дампом прошивки'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y m4 checkpolicy python3-pip

      - name: Clone Firmware Dump
        run: |
          echo "Клонирование дампа устройства..."
          git clone --depth 1 ${{ github.event.inputs.repo_url }} firmware_dump

      - name: Collect SELinux Files & Decompile
        run: |
          mkdir -p input_sepolicy/system/etc/selinux
          mkdir -p input_sepolicy/vendor/etc/selinux
          mkdir -p output_te
          
          echo "=== Подготовка идеального слепка (dump_root) для декомпилятора ==="
          
          # 1. Собираем системные политики (сглаживаем проблему system/system/...)
          find firmware_dump/system -type f -path "*/etc/selinux/*" -exec cp {} input_sepolicy/system/etc/selinux/ \;
          
          # 2. Собираем вендорские политики (теперь копируются ВСЕ файлы, включая .txt)
          find firmware_dump/vendor -type f -path "*/etc/selinux/*" -exec cp {} input_sepolicy/vendor/etc/selinux/ \;
          
          # 3. Ищем build.prop (нужен декомпилятору для определения версии API)
          BUILD_PROP=$(find firmware_dump/system -name "build.prop" | head -n 1)
          if [ -n "$BUILD_PROP" ]; then
            cp "$BUILD_PROP" input_sepolicy/system/build.prop
            echo "Найден build.prop: $BUILD_PROP"
          else
            echo "build.prop не найден. Создаем фейковый для Android 11 (API 30)"
            echo "ro.build.version.sdk=30" > input_sepolicy/system/build.prop
          fi

          # 4. Страховка от падений на assert (создаем текстовик версии, если его нет в дампе)
          if [ ! -f "input_sepolicy/vendor/etc/selinux/plat_sepolicy_vers.txt" ]; then
            echo "30.0" > input_sepolicy/vendor/etc/selinux/plat_sepolicy_vers.txt
          fi

          if [ ! -f "input_sepolicy/system/etc/selinux/plat_sepolicy.cil" ]; then
            echo "::error::plat_sepolicy.cil не найден! Проверьте структуру дампа."
            exit 1
          fi

          echo "=== Запуск декомпилятора ==="
          SCRIPT_PATH=$(find . -name "decompile_cil.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "::error::Скрипт decompile_cil.py не найден в репозитории!"
            exit 1
          fi
          
          echo "=== Восстановление удаленного config.py ==="
          cat << 'EOF' > "$(dirname "$SCRIPT_PATH")/sepolicy/config.py"
          default_variables = {
              'mls_num_sens': '1',
              'mls_num_cats': '1024',
          }
          EOF
          
          # Передаем путь к конкретному разделу, чтобы скрипт правильно 
          # вычислил dump_root. Декомпилируем вендорскую политику.
          python3 "$SCRIPT_PATH" -s input_sepolicy/vendor/etc/selinux -o output_te

      - name: Upload Decompiled Policy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled_sepolicy_te
          path: output_te/
          
